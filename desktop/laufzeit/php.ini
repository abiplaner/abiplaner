; PHP-Einstellungen der Desktop-App unter Windows (FrankenPHP bringt dort
; ein normales PHP mit DLL-Erweiterungen mit). Die App setzt PHPRC auf den
; Laufzeit-Ordner; macOS und Linux nutzen statische Builds ohne php.ini.
extension_dir = "${PHPRC}\ext"
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=sodium
extension=zip
extension=exif
extension=bcmath

memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 25M
post_max_size = 26M
date.timezone = Europe/Berlin
default_charset = "UTF-8"

display_errors = Off
log_errors = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
