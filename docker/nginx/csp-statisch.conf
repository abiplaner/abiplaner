# Content-Security-Policy fuer Antworten, die NICHT durch PHP laufen:
# Dateien aus public/ (gebaute Assets, Bilder, Schriften) und nginx-eigene
# Fehlerseiten (502/504, wenn PHP gar nicht antwortet).
#
# Nur im server-Block einbinden, NIE in security-headers.conf: Dieses Snippet
# wird auch im PHP-location-Block eingebunden, und zwei CSP-Header werden vom
# Browser beide erzwungen — die Schnittmenge waere die Politik.
#
# Hier steht bewusst KEINE Nonce: Sie wechselt pro Request und wird in
# App\Http\Middleware\ContentSecurityPolicy erzeugt. Die dynamischen Antworten,
# fuer die sie zaehlt, bekommen ihren Header von dort.
#
# 'unsafe-inline' bei script-src ist hier ohne Belang — eine .css- oder
# .js-Datei fuehrt keine Inline-Skripte aus. Die Direktiven, die auf diesem
# Pfad tatsaechlich etwas tun, sind object-src, base-uri und frame-ancestors.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
