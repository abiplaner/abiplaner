# Security-Header (Security-Audit)
# Per include in server- UND location-Bloecke eingebunden, da nginx add_header
# NICHT ueber location-Grenzen vererbt, sobald ein innerer Block eigene Header
# bzw. der dynamische PHP-Pfad greift. 'always' = auch bei Fehlerstatus senden.
# TLS terminiert Traefik; HSTS wird trotzdem ueber die HTTPS-Verbindung gesendet.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Die Content-Security-Policy steht seit dem 30.08.2026 (Modul 7.2, Stufe 2)
# NICHT mehr hier, sondern in App\Http\Middleware\ContentSecurityPolicy.
#
# Der Grund ist zwingend: script-src traegt jetzt eine Nonce statt
# 'unsafe-inline', und die wechselt pro Request. Ein statischer nginx-Header
# kann sie nicht tragen.
#
# Fuer Antworten, die nie durch PHP laufen (Dateien aus public/, nginx-eigene
# Fehlerseiten), gilt weiterhin eine statische Politik: csp-statisch.conf,
# eingebunden im server-Block. Sie darf NICHT in dieses Snippet — dieses hier
# wird auch im PHP-location-Block eingebunden, und dann gingen zwei CSP-Header
# hinaus, die der Browser beide erzwingt.
