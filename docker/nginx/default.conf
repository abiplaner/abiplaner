server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/public;

    index index.php index.html index.htm;

    charset utf-8;

    # I5: nginx-Versionsnummer aus Server-Header entfernen (Fingerprinting erschweren)
    server_tokens off;

    # --- Security-Header (Security-Audit) ---
    # Snippet wird zusaetzlich im PHP-location-Block eingebunden, da nginx
    # add_header nicht ueber location-Grenzen hinweg vererbt.
    include /var/www/html/docker/nginx/security-headers.conf;
    # CSP nur fuer den statischen Pfad. Dynamische Antworten bekommen ihre
    # (Nonce-tragende) Politik aus der Middleware — siehe csp-statisch.conf.
    include /var/www/html/docker/nginx/csp-statisch.conf;

    location / {
        resolver 127.0.0.11 valid=30s;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        resolver 127.0.0.11 valid=30s;
        set $upstream abiplaner_app:9000;
        fastcgi_pass $upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        # Security-Header auch fuer dynamische Antworten (kein add_header-Erbe ueber locations)
        include /var/www/html/docker/nginx/security-headers.conf;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Größere Uploads erlauben (für CSV/Excel Import)
    client_max_body_size 20M;
}
