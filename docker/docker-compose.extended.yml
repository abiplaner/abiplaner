services:
  # PHP-FPM mit Laravel
  abiplaner_app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: abiplaner-app:latest
    container_name: abiplaner-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - internal
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.abiplaner-app.rule=Host(`abiplaner.localhost`)"
      - "traefik.http.services.abiplaner-app.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_net"
    env_file: .env
    depends_on:
      - abiplaner_db
      - abiplaner_redis
      - abiplaner_mailhog

  abiplaner_queue:
    image: abiplaner-app:latest
    container_name: abiplaner-queue
    restart: unless-stopped
    command: php artisan queue:work
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      - abiplaner_db
      - abiplaner_redis
    networks:
      - internal

  abiplaner_db:
    image: mariadb:11.4
    container_name: abiplaner-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

  abiplaner_redis:
    image: redis:alpine
    container_name: abiplaner-redis
    restart: unless-stopped
    networks:
      - internal

  abiplaner_mailhog:
    image: mailhog/mailhog
    container_name: abiplaner-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks: # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: abiplaner_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - abiplaner_network
    depends_on:
      - db
      - redis
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

networks:
  abiplaner_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
