upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 300

; Fehler nie an den Client ausgeben, sondern nach stderr (docker logs).
; Ohne geladene php.ini gelten sonst die PHP-Defaults display_errors=On:
; am 20.10.2026 hat ein Scanner per ?a[k0][k1]... das Limit
; max_input_nesting_level ueberschritten, die Startup-Warning landete samt
; Pfaden im Response-Body ("headers already sent"). Die Input-Limits
; (max_input_vars=1000, max_input_nesting_level=64) bleiben bewusst auf
; Default: Schutz gegen HashDoS, kein Formular braucht mehr.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off

[Date]
date.timezone = Europe/Berlin

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
