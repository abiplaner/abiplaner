# Homepage abiplaner-bayern.de (statisch) hinter Traefik.
#
#   docker compose -f website/compose.yaml up -d
#
# Inhalt ändern: HTML in website/public bearbeiten, committen, auf dem Server
# `git pull` – nginx liefert die Dateien direkt aus dem Repo aus.
services:
  website:
    image: nginx:1-alpine
    container_name: abiplaner-website
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik_net
    labels:
      # Watchtower auf stiller laeuft mit --label-enable: ohne dieses Label
      # bekommt nginx keine automatischen Updates
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.abiplaner-website.rule=Host(`abiplaner-bayern.de`) || Host(`www.abiplaner-bayern.de`)"
      - "traefik.http.routers.abiplaner-website.entrypoints=websecure"
      - "traefik.http.routers.abiplaner-website.tls.certresolver=myresolver"
      - "traefik.http.routers.abiplaner-website.middlewares=abiplaner-website-hsts"
      - "traefik.http.middlewares.abiplaner-website-hsts.headers.stsSeconds=31536000"
      - "traefik.http.services.abiplaner-website.loadbalancer.server.port=80"

networks:
  traefik_net:
    external: true
