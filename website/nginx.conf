# Homepage abiplaner-bayern.de – statische Seiten, kein PHP.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Hinter Traefik (TLS) keine absoluten http://-Weiterleitungen erzeugen.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Update-Prüfung der Desktop-Apps. Die Adresse ist fest in jede ausgelieferte
    # App eingebaut – NIE ändern oder entfernen. Ziel: latest.json des neuesten
    # veröffentlichten GitHub-Releases (Entwürfe sind dort nicht sichtbar).
    location = /downloads/desktop/latest.json {
        return 302 https://github.com/abiplaner/abiplaner/releases/latest/download/latest.json;
    }
    # Früher: Download-Seite der ZIP-Edition.
    location ^~ /downloads {
        return 301 /installation;
    }

    location /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Saubere Adressen (/installation → installation.html).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\. { deny all; }
}
